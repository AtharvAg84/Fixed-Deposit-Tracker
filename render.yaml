# Render Blueprint Configuration for FD Tracker
# This file defines the infrastructure for deploying the FD Rate Tracker app

services:
  # ═══════════════════════════════════════════════════════════════════════
  # Backend Service (FastAPI + MCP Server)
  # ═══════════════════════════════════════════════════════════════════════
  - type: web
    name: fd-tracker-backend
    runtime: python
    region: oregon  # Change to your preferred region
    plan: free  # Change to 'starter' or higher for production
    
    # Build configuration
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install uvicorn fastapi
      PLAYWRIGHT_BROWSERS_PATH=$PWD/ms-playwright playwright install chromium --with-deps || playwright install chromium
    
    # Start command
    startCommand: cd server && python bridge.py
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/ms-playwright
      
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard
      
      - key: GROQ_API_KEY
        sync: false  # Set this in Render dashboard
      
      - key: PORT
        value: 8000
    
    # Health check
    healthCheckPath: /health
    
    # Auto-deploy
    autoDeploy: true
    
  # ═══════════════════════════════════════════════════════════════════════
  # Frontend Service (React + Vite)
  # ═══════════════════════════════════════════════════════════════════════
  - type: web
    name: fd-tracker-frontend
    runtime: node
    region: oregon  # Should match backend region
    plan: free  # Change to 'starter' or higher for production
    
    # Root directory for frontend
    rootDir: client/fd-tracker
    
    # Build configuration
    buildCommand: npm install && npm run build
    
    # Start command (serves the built static files)
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    
    # Environment variables
    envVars:
      - key: NODE_VERSION
        value: 18
      
      # Backend API URL - update this after backend is deployed
      - key: VITE_API_URL
        value: https://fd-tracker-backend.onrender.com
    
    # Auto-deploy
    autoDeploy: true

