# Render Blueprint for Docker Deployment
# Alternative to render.yaml for better Playwright support

services:
  # Backend using Docker (better for Playwright)
  - type: web
    name: fd-tracker-backend-docker
    runtime: docker
    region: oregon
    plan: starter  # Docker requires paid plan on Render
    
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      
      - key: GROQ_API_KEY
        sync: false
      
      - key: PORT
        value: 8000
    
    healthCheckPath: /health
    autoDeploy: true
    
    disk:
      name: fd-tracker-data
      mountPath: /app/server/data
      sizeGB: 1

  # Frontend (same as before)
  - type: web
    name: fd-tracker-frontend
    runtime: static
    region: oregon
    plan: free
    
    rootDir: client/fd-tracker
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    
    envVars:
      - key: NODE_VERSION
        value: 18
      
      - key: VITE_API_URL
        value: https://fd-tracker-backend-docker.onrender.com
    
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    autoDeploy: true
